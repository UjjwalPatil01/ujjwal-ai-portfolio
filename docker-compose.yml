version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ujjwal-portfolio-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Ujjwal Patil AI/ML Portfolio API
      - APP_ENV=production
      - PORT=8000
      - SQLITE_DB_PATH=/app/data/portfolio.db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
      - RATE_LIMIT_MAX_REQUESTS=5
      - RATE_LIMIT_WINDOW_SECONDS=600
    volumes:
      - portfolio_sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: ujjwal-portfolio-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  portfolio_sqlite_data:
    driver: local
